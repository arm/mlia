name: Docs

on:
  pull_request:
    paths:
      - 'README.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_call:
    inputs:
      publish:
        description: Publish documentation for the release wheel artifact
        required: false
        type: boolean
        default: false
      wheel-artifact:
        description: Name of the release workflow wheel artifact
        required: false
        type: string
        default: wheel

env:
  PYTHON_VERSION: '3.10'

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | INTERNAL_PYPI_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | INTERNAL_PYPI_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} MLIA_DOCS_ARTIFACTORY_URL | MLIA_DOCS_ARTIFACTORY_URL

jobs:
  build-docs:
    name: Build docs
    runs-on: ${{ fromJson(vars.UBUNTU_RUNNER || '["ubuntu-24.04-arm"]') }}
    steps:
      - name:
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --no-sources --no-install-project --only-group docs
      - run: uv run mkdocs build --strict --no-directory-urls
      - name: Upload docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-site-mlia
          path: .mkdocs/site/
          if-no-files-found: error
      - name: Download release wheel
        if: inputs.publish
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel-artifact }}
          path: release-wheel
      - name: Read release metadata
        id: release-metadata
        if: inputs.publish
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find release-wheel -maxdepth 1 -type f -name '*.whl')
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one release wheel, found ${#wheels[@]}" >&2
            exit 1
          fi

          metadata=$(unzip -p "${wheels[0]}" '*.dist-info/METADATA' | tr -d '\r' | awk 'NF == 0 { exit } { print }')
          name=$(sed -n 's/^Name: //p' <<< "${metadata}")
          version=$(sed -n 's/^Version: //p' <<< "${metadata}")
          component=$(printf '%s' "${name}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')
          if [ -z "${component}" ] || [ -z "${version}" ]; then
            echo "Release wheel metadata does not define Name and Version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match wheel version ${version}" >&2
            exit 1
          fi
          case "${version}" in
            *.dev*|*+*) echo "Development and local versions are unsupported" >&2; exit 1 ;;
          esac
          echo "component=${component}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Publish versioned documentation
        if: inputs.publish
        uses: Arm-Debug/github-workflow-wizardry/.github/actions/publish-versioned-docs@7549a2dfbaa47ea0e48685de0f152a3bc2fa7896
        with:
          site-path: .mkdocs/site
          component: ${{ steps.release-metadata.outputs.component }}
          version: ${{ steps.release-metadata.outputs.version }}
          repository-url: ${{ env.MLIA_DOCS_ARTIFACTORY_URL }}
          username: ${{ env.INTERNAL_PYPI_USERNAME }}
          password: ${{ env.INTERNAL_PYPI_PASSWORD }}
          source-repository: ${{ github.repository }}
          source-ref: ${{ github.ref_name }}
          source-commit: ${{ github.sha }}
          format: mkdocs-offline
