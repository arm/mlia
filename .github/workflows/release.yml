name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to release
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | INTERNAL_PYPI_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | INTERNAL_PYPI_PASSWORD ;

jobs:
  resolve_source:
    name: Resolve Release Source
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve source commit and release tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          tag=""
          is_release=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "commit must be a full 40-character commit SHA" >&2
              exit 1
            fi
            if [ "$(git cat-file -t "$REQUESTED_COMMIT" 2>/dev/null || true)" != "commit" ]; then
              echo "commit does not identify a fetched commit: $REQUESTED_COMMIT" >&2
              exit 1
            fi
            commit=$(git rev-parse --verify "${REQUESTED_COMMIT}^{commit}")
            mapfile -t release_tags < <(git tag --points-at "$commit" --list 'v*.*.*')
            if [ "${#release_tags[@]}" -ne 1 ]; then
              echo "commit must have exactly one v*.*.* release tag; found ${#release_tags[@]}" >&2
              exit 1
            fi
            tag=${release_tags[0]}
            is_release=true
          else
            commit=$(git rev-parse --verify "${EVENT_SHA}^{commit}")
            if [ "$EVENT_REF_TYPE" = "tag" ]; then
              tag=$EVENT_REF_NAME
              is_release=true
            fi
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build_and_test_wheel:
    name: Build And Test Wheel
    needs: resolve_source
    runs-on: ${{ fromJson(vars.UBUNTU_RUNNER || '["ubuntu-24.04-arm"]') }}
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve_source.outputs.commit }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build --wheel
      - run: uv sync --no-sources --no-install-project --group test
      - name: Validate wheel SBOM
        run: uv run --no-sync python scripts/validate_wheel_sbom.py dist/*.whl
      - run: |
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            -- pytest --no-success-flaky-report tests/ | tee coverage.txt
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  publish_release:
    name: Publish Release
    if: >-
      ${{
        always() &&
        needs.resolve_source.result == 'success' &&
        needs.build_and_test_wheel.result == 'success' &&
        (github.repository_owner != 'arm' || needs.resolve_source.outputs.is_release == 'true')
      }}
    needs:
      - resolve_source
      - build_and_test_wheel
    runs-on: ${{ fromJson(vars.UBUNTU_RUNNER || '["ubuntu-24.04-arm"]') }}
    env:
      PUBLISH_PYPI_HOST: ${{ secrets.PUBLISH_PYPI_HOST || '' }}
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve_source.outputs.commit }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - run: uv sync --no-sources --no-install-project --group test
      - name: Validate wheel SBOM
        run: uv run --no-sync python scripts/validate_wheel_sbom.py dist/*.whl
      - if: ${{ env.PUBLISH_PYPI_HOST != '' }}
        run: uv publish dist/*
        env:
          UV_PUBLISH_URL: ${{ env.PUBLISH_PYPI_HOST }}
          UV_PUBLISH_USERNAME: ${{ secrets.INTERNAL_PYPI_USERNAME || secrets.PUBLISH_PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.INTERNAL_PYPI_PASSWORD || secrets.PUBLISH_PYPI_PASSWORD }}

  publish_docs:
    name: Publish Documentation
    if: ${{ needs.resolve_source.outputs.is_release == 'true' }}
    needs:
      - resolve_source
      - publish_release
    uses: ./.github/workflows/docs.yml
    with:
      publish: true
      release-tag: ${{ needs.resolve_source.outputs.tag }}
      source-ref: ${{ needs.resolve_source.outputs.commit }}
      wheel-artifact: wheel
    secrets: inherit

  blackduck_scan:
    name: Black Duck Scan
    if: >-
      ${{ github.event.repository.private &&
      needs.resolve_source.outputs.is_release == 'true' }}
    needs: resolve_source
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/blackduck-full-scan.yml@24b734441123e62c1bb8fe180bf17efc0dec1d31
    with:
      project-version: ${{ needs.resolve_source.outputs.tag }}
      source-ref: ${{ needs.resolve_source.outputs.commit }}
    secrets:
      BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}

  sync_to_public_repo:
    needs: build_and_test_wheel
    if: >-
      ${{ github.event.repository.private && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/sync-to-public-repo.yml@main
    with:
      public_repo: arm/mlia
    secrets: inherit
